<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Kirim Berkas</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap" id="app"><p class="mute">Sebentar ya…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const t=new URLSearchParams(location.search).get('t');
const app=document.getElementById('app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tgl=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
async function load(){
  if(!t)return app.innerHTML='<h1>Link belum lengkap</h1><p class="mute">Minta link yang benar lewat WhatsApp ya.</p>';
  const {data,error}=await sb.rpc('get_order',{p_token:t});
  if(error||!data)return app.innerHTML='<h1>Link tidak ditemukan</h1><p class="mute">Cek lagi linknya, atau hubungi kami lewat WhatsApp.</p>';
  const n=data.items.filter(i=>i.file_name||i.jawaban).length,tot=data.items.length;
  app.innerHTML=`<p class="mute">${e(data.layanan||'')}</p>
  <h1>Halo, ${e(data.klien)}</h1>
  <p class="mute">${e(data.judul||'')}${data.deadline?' · target selesai '+tgl(data.deadline):''}</p>
  <div class="card"><div class="row"><b>${n} dari ${tot} sudah terisi</b><span class="tag">${e(data.status)}</span></div>
  <div class="bar"><i style="width:${tot?n/tot*100:0}%"></i></div>
  ${n==tot&&tot?'<span class="mute">Semua berkas sudah masuk. Terima kasih, kami lanjutkan ya.</span>':'<span class="mute">Kirim satu per satu, centangnya otomatis muncul.</span>'}</div>
  <div class="card">${data.items.map(i=>{const d=i.tipe=='teks'?!!i.jawaban:!!i.file_name;return `<div class="item ${d?'done':''}"><div class="box">${d?'✓':''}</div>
   <div class="grow"><b>${e(i.nama)}</b>${i.petunjuk?`<div class="mute">${e(i.petunjuk)}</div>`:''}
   ${i.tipe=='teks'?`<textarea rows="4" maxlength="5000" data-t="${i.id}" placeholder="Tulis di sini…" style="margin-top:8px">${e(i.jawaban||'')}</textarea><button class="sm pri" data-s="${i.id}">Simpan jawaban</button>`:(i.file_name?`<div class="fn">${e(i.file_name)}</div>`:'')}</div>
   ${i.tipe=='teks'?'':`<label class="btn sm ${i.file_name?'':'pri'}">${i.file_name?'Ganti':'Pilih file'}<input type="file" hidden data-id="${i.id}"></label>`}</div>`}).join('')}</div>
  <p class="mute">Ukuran maksimal 20 MB per file. Ada kendala? <a href="https://wa.me/${CFG.wa}" style="color:var(--acc)">Chat WhatsApp</a></p>`;
  app.querySelectorAll('input[type=file]').forEach(f=>f.onchange=()=>up(f));
  app.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>simpan(b.dataset.s));
}
async function simpan(id){
  const x=app.querySelector('textarea[data-t="'+id+'"]').value;
  const r=await sb.rpc('save_text',{p_token:t,p_item:id,p_text:x});
  r.error?alert('Gagal menyimpan, coba lagi ya.'):load();
}
async function up(inp){
  const file=inp.files[0];if(!file)return;
  if(file.size>20*1024*1024)return alert('Ukuran file maksimal 20 MB ya.');
  const lab=inp.parentElement;lab.firstChild.textContent='Mengunggah…';
  const id=inp.dataset.id,path=id+'/'+Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');
  const u=await sb.storage.from(CFG.bucket).upload(path,file);
  if(u.error){alert('Gagal mengunggah, coba lagi ya.');return load();}
  const r=await sb.rpc('mark_uploaded',{p_token:t,p_item:id,p_path:path,p_name:file.name});
  if(r.error)alert('Berkas terkirim tapi belum tercatat. Coba pilih lagi ya.');
  load();
}
load();
</script></body></html>
